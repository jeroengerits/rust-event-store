name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: shellcheck -x -P scripts .github/scripts/*.sh scripts/*.sh
      - run: bash .github/scripts/check-build-context.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --all-features --test postgres_contract -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventstore_test
      - run: cargo test --locked --all-features --test api_contract --test storage_contract -- --ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventstore_test
      - name: Smoke-test Cloud-style configuration
        env:
          PORT: '18081'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventstore_test
          EVENTSTORE_HOST: '::'
          EVENTSTORE_API_KEY: ci-test-key
        run: |
          cargo build --locked --bin eventstore
          target/debug/eventstore serve > "$RUNNER_TEMP/eventstore-cloud.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/eventstore-cloud.log"' EXIT
          bash .github/scripts/smoke-test.sh 'http://[::1]:18081'
      - name: Test recovery after application crash
        env:
          RECOVERY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventstore_test
        run: bash .github/scripts/recovery-test.sh
      - name: Test recovery after PostgreSQL crash
        run: bash .github/scripts/postgres-crash-test.sh
      - name: Build and smoke-test container
        run: |
          docker build -t eventstore-ci .
          docker run -d --name eventstore-ci --network host -e EVENTSTORE_PORT=18080 -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/eventstore_test -e EVENTSTORE_API_KEY=ci-test-key eventstore-ci
          trap 'docker logs eventstore-ci; docker rm -fv eventstore-ci' EXIT
          bash .github/scripts/smoke-test.sh http://127.0.0.1:18080
