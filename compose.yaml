services:
  eventstore:
    build: .
    environment:
      EVENTSTORE_API_KEY: ${EVENTSTORE_API_KEY:?Set EVENTSTORE_API_KEY before starting the service}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL connection URL}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
