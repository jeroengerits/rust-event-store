[package]
name = "eventstore"
default-run = "eventstore"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small HTTP event store backed by PostgreSQL"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
